    // 1. Web Audio API Sound Effects Synthesizer
    // ========================================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }
      playSuccess() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.12, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.25);
          });
        } catch (e) {}
      }
      playPlotArmor() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.35);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        } catch (e) {}
      }
      playDice() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          for (let i = 0; i < 4; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(200 + Math.random() * 300, now + i * 0.06);
            gain.gain.setValueAtTime(0.08, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.04);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.04);
          }
        } catch (e) {}
      }
    }

    function analyzePlayerInputIntent(rawText) {
      if (!rawText || !rawText.trim()) return 'balanced';
      const clean = rawText.toLowerCase().replace(/[^\w\s\u0600-\u06FF]/gi, ' ');
      const words = clean.split(/\s+/).filter(Boolean);

      const scores = {
        attack: 0,
        stealth: 0,
        environment: 0,
        tactical: 0,
        reckless: 0
      };

      for (const word of words) {
        const stripped = word.replace(/^(ال|و|ف|ب|ل|ت|ي)/, '');
        for (const [intent, keywords] of Object.entries(INTENT_LEXICONS)) {
          for (const kw of keywords) {
            if (word === kw || word.includes(kw) || (stripped.length > 2 && stripped.includes(kw))) {
              scores[intent] += 1;
            }
          }
        }
      }

      let bestIntent = 'balanced';
      let maxScore = 0;
      for (const [intent, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          bestIntent = intent;
        }
      }

      return maxScore > 0 ? bestIntent : 'tactical';
    }

    function generateOfflineChapter(world, character, playerDecision, turnNumber, d20Roll, isAr, previousTurns) {
      const detectedIntent = analyzePlayerInputIntent(playerDecision);
      const templateGroup = NARRATIVE_TEMPLATES[detectedIntent] || NARRATIVE_TEMPLATES.tactical;

      const roll = d20Roll || Math.floor(Math.random() * 20) + 1;
      const rollBonus = roll >= 14 ? 10 : (roll <= 6 ? -10 : 0);

      let traitSynergy = false;
      const traitLower = (character.trait || '').toLowerCase();
      if (detectedIntent === 'stealth' && (traitLower.includes('حذر') || traitLower.includes('ملاحظ') || traitLower.includes('هدوء') || traitLower.includes('observant') || traitLower.includes('stealth'))) {
        traitSynergy = true;
      } else if (detectedIntent === 'attack' && (traitLower.includes('شجاع') || traitLower.includes('قوة') || traitLower.includes('هجوم') || traitLower.includes('brave') || traitLower.includes('fierce'))) {
        traitSynergy = true;
      } else if (detectedIntent === 'environment' && (traitLower.includes('ميكانيك') || traitLower.includes('أدوات') || traitLower.includes('طبيب') || traitLower.includes('engineer') || traitLower.includes('medic'))) {
        traitSynergy = true;
      } else if (detectedIntent === 'tactical' && (traitLower.includes('ذكاء') || traitLower.includes('تكتيك') || traitLower.includes('دهقان') || traitLower.includes('cunning') || traitLower.includes('tactical'))) {
        traitSynergy = true;
      }

      const titlesList = isAr ? templateGroup.successTitlesAr : templateGroup.successTitlesEn;
      const scenesList = isAr ? templateGroup.scenesAr : templateGroup.scenesEn;

      const titleIdx = (turnNumber - 1) % titlesList.length;
      const sceneIdx = ((turnNumber - 1) + (roll % 3)) % scenesList.length;

      let title = titlesList[titleIdx];
      let sceneTemplate = scenesList[sceneIdx];

      const decisionSnippet = playerDecision.trim().length > 70 
        ? playerDecision.trim().slice(0, 68) + '...' 
        : playerDecision.trim();

      let scene = sceneTemplate
        .replace(/{DECISION}/g, decisionSnippet)
        .replace(/{ROLE}/g, character.role || (isAr ? 'جندي دعم' : 'Support Operative'))
        .replace(/{TRAIT}/g, character.trait || (isAr ? 'اليقظة الميدانية' : 'Field Alertness'))
        .replace(/{GOAL}/g, character.secretGoal || (isAr ? 'البقاء على قيد الحياة' : 'Survival'));

      const worldLore = world.loreKeywords ? world.loreKeywords[turnNumber % world.loreKeywords.length] : '';
      if (worldLore && isAr) {
        scene += ` في تلك اللحظة، هبت رياح المعركة مشبعة بآثار (${worldLore}) الخاص بـ ${world.name.split('|')[0]}، مؤكدة أن قرارك قلب الموازين في تلك الزاوية الحرجة.`;
      } else if (worldLore && !isAr) {
        scene += ` At that critical juncture, the battlefield reverberated with signature traces of (${worldLore}), proving your choice turned the tides of this sector.`;
      }

      if (traitSynergy) {
        if (isAr) {
          scene += ` ✨ [تناغم تكتيكي مذهل]: توافقت خطوتك تماماً مع سمتك كـ (${character.trait}) وحققت تفوقاً مضاعفاً!`;
        } else {
          scene += ` ✨ [Tactical Synergy]: Your chosen action harmonized flawlessly with your trait (${character.trait}), granting a critical advantage!`;
        }
      }

      let heroImpact = (isAr ? templateGroup.heroImpactAr : templateGroup.heroImpactEn)
        .replace(/{HERO}/g, world.canonHero);

      let consequence = isAr ? templateGroup.consequenceAr : templateGroup.consequenceEn;

      let healthChange = templateGroup.healthBase + (traitSynergy ? 10 : 0) + (roll >= 15 ? 5 : (roll <= 5 ? -10 : 0));
      let xpGained = templateGroup.xpBase + (traitSynergy ? 15 : 0) + rollBonus;

      return {
        turnNumber,
        title: `${isAr ? 'الفصل' : 'Chapter'} ${turnNumber}: ${title}`,
        scene,
        canonHeroEvent: heroImpact,
        consequence,
        healthChange,
        xpGained: Math.max(20, xpGained),
        detectedIntent,
        d20Roll: roll
      };
    }
